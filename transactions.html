<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Mentor - Transactions</title>
  <link rel="stylesheet" href="transactions.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="transactions.js" defer></script>
</head>
<body>
  <main class="app">

    <!-- =====================================
         1. TRANSACTIONS LIST PAGE
         ===================================== -->

    <section id="listView" class="view">

      <!-- Page Header -->
      <header class="page-header">

        <h1>Transactions</h1>

        <button
          id="addButton"
          class="icon-button"
          type="button"
          aria-label="Add transaction"
        >
          <i data-lucide="plus"></i>
        </button>

      </header>


      <!-- Search Bar -->
      <label class="search">

        <i data-lucide="search"></i>

        <input
          id="searchInput"
          type="search"
          placeholder="Search transactions"
          aria-label="Search transactions"
        >

      </label>


      <!-- Transaction Filter Tabs -->
      <div
        class="tabs"
        role="group"
        aria-label="Transaction filter"
      >

        <button class="tab active" data-filter="all" type="button">
          All
        </button>

        <button class="tab" data-filter="income" type="button">
          Income
        </button>

        <button class="tab" data-filter="expense" type="button">
          Expense
        </button>

      </div>


      <!-- Mood and Spending Patterns -->
      <button
        id="moodLink"
        class="mood-link"
        type="button"
      >

        <span class="mood-symbol">
          <i data-lucide="chart-column-increasing"></i>
        </span>

        <span>
          <strong>Mood &amp; Spending Patterns</strong>
          <small>See how emotions affect your spending</small>
        </span>

        <i data-lucide="chevron-right"></i>

      </button>


      <!-- Transaction List -->
      <div id="transactionGroups"></div>


      <!-- Empty Message -->
      <p id="emptyMessage" class="empty" hidden>
        No transactions found.
      </p>

    </section>



    <!-- =====================================
         2. ADD TRANSACTION PAGE
         ===================================== -->

    <section id="addView" class="view" hidden>

      <!-- Page Header -->
      <header class="page-header">

        <button
          class="icon-button back"
          type="button"
          aria-label="Back"
        >
          <i data-lucide="arrow-left"></i>
        </button>

        <h1>Add Transaction</h1>

        <span class="header-space"></span>

      </header>


      <!-- Expense / Income Tabs -->
      <div class="tabs type-tabs">

        <button
          class="type-tab active"
          data-type="expense"
          type="button"
        >
          Expense
        </button>

        <button
          class="type-tab"
          data-type="income"
          type="button"
        >
          Income
        </button>

      </div>


      <!-- Add Transaction Form -->
      <form id="transactionForm">

        <!-- Amount -->
        <label class="field-title" for="amountInput">
          Amount
        </label>

        <div class="amount-box">

          <span>$</span>

          <input
            id="amountInput"
            type="text"
            inputmode="none"
            readonly
            value="0.00"
            aria-label="Transaction amount"
          >

        </div>


        <!-- Number Keypad -->
        <div class="keypad" aria-label="Amount keypad">

          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>

          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>

          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>

          <button type="button" data-key=".">.</button>
          <button type="button" data-key="0">0</button>

          <button
            type="button"
            data-key="back"
            aria-label="Delete digit"
          >
            <i data-lucide="delete"></i>
          </button>

        </div>


        <!-- Category Selection -->
        <label class="field-title">
          Category
        </label>

        <div
          id="categoryOptions"
          class="categories"
        ></div>


        <!-- Transaction Date -->
        <label class="field-title" for="transactionDate">
          Date
        </label>

        <input
          id="transactionDate"
          type="date"
          required
        >


        <!-- Transaction Note -->
        <label class="field-title" for="transactionNote">
          Note (optional)
        </label>

        <input
          id="transactionNote"
          type="text"
          maxlength="100"
          placeholder="Add a note..."
        >


        <!-- Spending Mood -->
        <div id="moodField">

          <div class="field-title">
            Spending Mood (optional)
          </div>

          <p class="field-subtitle">
            How did you feel when making this purchase?
          </p>

          <div
            id="moodChoices"
            class="mood-choices"
          ></div>

        </div>


        <!-- Save Transaction -->
        <button
          class="primary"
          type="submit"
        >
          Save Transaction
        </button>

      </form>

    </section>



    <!-- =====================================
         3. MOOD ANALYTICS PAGE
         ===================================== -->

    <section id="moodView" class="view" hidden>

      <!-- Page Header -->
      <header class="page-header">

        <button
          class="icon-button back"
          type="button"
          aria-label="Back"
        >
          <i data-lucide="arrow-left"></i>
        </button>

        <h1>Mood &amp; Spending Patterns</h1>

        <span class="header-space"></span>

      </header>


      <!-- Mood Period Tabs -->
      <div class="tabs mood-tabs">

        <button
          class="period-tab"
          data-period="week"
          type="button"
        >
          This Week
        </button>

        <button
          class="period-tab active"
          data-period="month"
          type="button"
        >
          This Month
        </button>

        <button
          class="period-tab"
          data-period="all"
          type="button"
        >
          All Time
        </button>

      </div>


      <!-- Total Spending by Mood -->
      <section class="panel">

        <h2>Total Spending by Mood</h2>

        <p
          id="moodTotal"
          class="mood-total"
        ></p>

        <div
          id="moodChart"
          class="mood-chart"
        ></div>

      </section>


      <!-- Mood Breakdown -->
      <section class="panel">

        <h2>Mood Breakdown</h2>

        <div id="moodBreakdown"></div>

      </section>

    </section>

  </main>



  <!-- =====================================
       4. BOTTOM NAVIGATION
       ===================================== -->

  <nav class="bottom-nav" aria-label="Main navigation">

    <!-- Home -->
    <a href="index.html">
      <i data-lucide="house"></i>
      <span>Home</span>
    </a>

    <!-- Budget -->
    <a href="budget.html">
      <i data-lucide="wallet"></i>
      <span>Budget</span>
    </a>

    <!-- Transactions -->
    <a href="transactions.html" class="current" aria-current="page">
      <i data-lucide="receipt-text"></i>
      <span>Transactions</span>
    </a>

    <!-- AI Chat -->
    <a href="ai-chat.html">
      <i data-lucide="message-circle"></i>
      <span>AI Chat</span>
    </a>

    <!-- Goals -->
    <a href="savings.html">
      <i data-lucide="target"></i>
      <span>Goals</span>
    </a>

    <!-- Menu -->
    <a href="menu.html">
      <i data-lucide="menu"></i>
      <span>Menu</span>
    </a>
  </nav>
</body>
</html>
